<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0c11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="トークン管理">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script>
// 初回描画前に配色を適用(ちらつき防止)。保存が無ければダーク
try { document.documentElement.dataset.theme = localStorage.getItem("tcg-token-theme") === "bright" ? "bright" : "dark"; }
catch (e) { document.documentElement.dataset.theme = "dark"; }
</script>
<title>神椿TCG非公式トークン管理</title>
</head>
<body>

<!-- トークン画像はここで一括定義(差し替え時はこの symbol を編集) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 彩度を抑えた色 + 左上からのやわらかい光で立体感を出す -->
    <radialGradient id="g-alpha" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#e6a5b0"/><stop offset="1" stop-color="#bf7482"/></radialGradient>
    <radialGradient id="g-beta" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#9ccbe4"/><stop offset="1" stop-color="#5f98b9"/></radialGradient>
    <radialGradient id="g-omega" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#a38ddb"/><stop offset="1" stop-color="#6c54a8"/></radialGradient>
    <radialGradient id="g-vol" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#ecc569"/><stop offset="1" stop-color="#b98d32"/></radialGradient>
    <!-- VOLノイズストッパーON中、未獲得のVOL位置に出す錠前 -->
    <symbol id="ic-lock" viewBox="0 0 24 24"><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path fill="currentColor" fill-rule="evenodd" d="M7.5 10h9a2.5 2.5 0 0 1 2.5 2.5v6a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 5 18.5v-6A2.5 2.5 0 0 1 7.5 10zM12 14a1.5 1.5 0 1 0 0 3a1.5 1.5 0 1 0 0-3z"/></symbol>
    <symbol id="tk-alpha" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="url(#g-alpha)"/><circle cx="50" cy="50" r="45" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.5"/>
    </symbol>
    <symbol id="tk-beta" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="url(#g-beta)"/><circle cx="50" cy="50" r="45" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.5"/>
    </symbol>
    <symbol id="tk-omega" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="url(#g-omega)"/><circle cx="50" cy="50" r="45" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.5"/>
    </symbol>
    <symbol id="tk-vol" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="url(#g-vol)"/><circle cx="50" cy="50" r="45" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1.5"/>
    </symbol>
  </defs>
</svg>

<main id="app">
  <header class="head">
    <h1 class="title">神椿TCG非公式トークン管理アプリ</h1>
    <div class="theme-switch" role="group" aria-label="配色">
      <button type="button" data-theme="dark" aria-pressed="true">ダーク</button>
      <button type="button" data-theme="bright" aria-pressed="false">ブライト</button>
    </div>
  </header>

  <div class="topbar">
    <div class="undo-count" id="undoCount" hidden>
      <svg viewBox="0 0 44 44" aria-hidden="true"><circle class="ring" cx="22" cy="22" r="19" pathLength="100"/></svg>
      <span id="undoNum"></span>
    </div>
    <button id="resetAll" class="btn reset-all" type="button">全てリセット</button>
    <button id="undo" class="btn undo" type="button" hidden>元に戻す</button>
  </div>

  <section id="tokens"></section>

  <div class="mid">
    <button id="noise" class="btn noise" type="button" aria-pressed="false">
      <svg class="noise-icon" viewBox="0 0 24 24" aria-hidden="true"><mask id="lock-hole"><rect width="24" height="24" fill="#fff"/><circle cx="12" cy="15.5" r="1.5" fill="#000"/></mask><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="5" y="10" width="14" height="11" rx="2.5" fill="currentColor" mask="url(#lock-hole)"/></svg>
      <span class="noise-text">VOLノイズ<br>ストッパー</span>
      <span class="noise-state">OFF</span>
    </button>
    <button id="limited" class="limited" type="button" aria-pressed="false">
      <span class="limited-text">LIMITED</span>
      <span class="limited-used">使用済</span>
    </button>
  </div>

  <section class="panel dice" id="dice">
    <div class="dice-top">
      <div class="dice-result" id="diceResult" aria-live="polite"></div>
      <div class="dice-total" id="diceTotal"></div>
    </div>
    <div class="dice-btns" id="diceBtns"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
